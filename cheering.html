<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Forza Milan — Match Moment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --rosso:#FB090B;
    --rosso-deep:#8C0000;
    --nero:#0A0A0A;
    --nero-2:#151515;
    --bianco:#F5F5F0;
    --oro:#E7B740;
    --oro-dim:#8a6c26;
    --stripe-w: 92px;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--nero);
    color:var(--bianco);
    font-family:'Barlow Condensed', sans-serif;
    overflow-x:hidden;
    min-height:100vh;
    position:relative;
  }

  /* Stadium floodlight ambience */
  body::before{
    content:"";
    position:fixed;
    inset:0;
    background:
      radial-gradient(ellipse 900px 500px at 20% -10%, rgba(251,9,11,0.25), transparent 60%),
      radial-gradient(ellipse 900px 500px at 80% -10%, rgba(251,9,11,0.25), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  /* Rossoneri hooped stripes backdrop */
  .stripes{
    position:fixed;
    inset:0;
    z-index:-1;
    background: repeating-linear-gradient(
      90deg,
      var(--nero) 0,
      var(--nero) var(--stripe-w),
      var(--rosso-deep) var(--stripe-w),
      var(--rosso-deep) calc(var(--stripe-w) * 2)
    );
    opacity:0.55;
  }
  .stripes::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(10,10,10,0.65), rgba(10,10,10,0.92) 40%, var(--nero) 85%);
  }

  header{
    position:relative;
    z-index:2;
    text-align:center;
    padding:56px 20px 18px;
  }

  .crest{
    width:64px;
    height:64px;
    margin:0 auto 18px;
    position:relative;
    animation: crestFloat 3.6s ease-in-out infinite;
  }
  .crest img{width:100%;height:100%;display:block; filter:drop-shadow(0 6px 14px rgba(251,9,11,0.35));}
  @keyframes crestFloat{
    0%,100%{ transform:translateY(0) rotate(0deg); }
    50%{ transform:translateY(-6px) rotate(-2deg); }
  }

  .stars{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:10px;
  }
  .stars span{
    width:10px;height:10px;
    background:var(--oro);
    clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
    opacity:0;
    animation: starIn .5s ease forwards, starTwinkle 2.6s ease-in-out infinite;
    animation-delay: calc(var(--i,0) * 0.08s), calc(0.6s + var(--i,0) * 0.15s);
  }
  @keyframes starIn{ to{ opacity:0.9; transform:scale(1); } }
  @keyframes starTwinkle{
    0%,100%{ opacity:0.9; }
    50%{ opacity:0.4; }
  }

  h1{
    font-family:'Anton', sans-serif;
    font-weight:400;
    font-size:clamp(2.6rem, 8vw, 5.5rem);
    line-height:0.92;
    margin:0;
    letter-spacing:0.5px;
    text-transform:uppercase;
    color:var(--bianco);
    text-shadow: 0 0 40px rgba(251,9,11,0.35);
    opacity:0;
    animation: fadeUpCh .8s cubic-bezier(.16,1,.3,1) .3s forwards;
  }
  h1 .em{
    color:var(--rosso);
    -webkit-text-stroke: 1.5px var(--bianco);
  }
  @keyframes fadeUpCh{
    from{ opacity:0; transform:translateY(18px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .subline{
    margin:14px auto 0;
    max-width:520px;
    font-size:1.25rem;
    color:#c9c5bd;
    font-weight:400;
    letter-spacing:0.3px;
    opacity:0;
    animation: fadeUpCh .8s cubic-bezier(.16,1,.3,1) .5s forwards;
  }

  /* The "jumbotron" screen */
  main{
    position:relative;
    z-index:2;
    display:flex;
    justify-content:center;
    padding:28px 16px 20px;
  }

  .screen-rig{
    width:100%;
    max-width:820px;
    position:relative;
    opacity:0;
    transform:translateY(24px) scale(0.98);
    animation: rigIn .9s cubic-bezier(.16,1,.3,1) .55s forwards;
  }
  @keyframes rigIn{
    to{ opacity:1; transform:translateY(0) scale(1); }
  }

  .screen-frame{
    position:relative;
    border-radius:10px;
    padding:14px;
    background:
      linear-gradient(155deg, #232323, #0c0c0c 55%, #1a1a1a);
    border:1px solid #2c2c2c;
    box-shadow:
      0 30px 80px -20px rgba(0,0,0,0.8),
      0 0 0 1px rgba(255,255,255,0.02) inset,
      0 0 120px -20px rgba(251,9,11,0.25);
  }

  .screen-frame::before{
    content:"";
    position:absolute;
    top:8px; left:14px; right:14px;
    height:1px;
    background:linear-gradient(90deg, transparent, var(--rosso), var(--oro), transparent);
    opacity:0.8;
  }

  .screen-inner{
    position:relative;
    border-radius:4px;
    overflow:hidden;
    background:#000;
    aspect-ratio:16/9;
  }

  video{
    width:100%;
    height:100%;
    display:block;
    object-fit:cover;
    background:#000;
  }

  .scanlight{
    position:absolute;
    inset:0;
    pointer-events:none;
    background:linear-gradient(180deg, rgba(255,255,255,0.06), transparent 30%);
    mix-blend-mode:overlay;
  }

  .rig-label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:10px;
    padding:0 4px;
    font-size:0.95rem;
    color:#7d7a74;
    letter-spacing:0.5px;
  }
  .rig-label b{color:var(--bianco); font-weight:600;}
  .live-dot{
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--rosso);
    font-weight:600;
  }
  .live-dot::before{
    content:"";
    width:8px;height:8px;
    border-radius:50%;
    background:var(--rosso);
    box-shadow:0 0 10px var(--rosso);
    animation:pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1; transform:scale(1);}
    50%{opacity:0.4; transform:scale(0.75);}
  }

  /* Controls */
  .controls{
    display:flex;
    justify-content:center;
    gap:14px;
    flex-wrap:wrap;
    margin:26px 0 8px;
    opacity:0;
    animation: fadeUpCh .8s cubic-bezier(.16,1,.3,1) .8s forwards;
  }

  button.cta{
    font-family:'Barlow Condensed', sans-serif;
    font-weight:600;
    font-size:1.15rem;
    letter-spacing:0.5px;
    padding:14px 30px;
    border-radius:3px;
    border:2px solid var(--rosso);
    background:var(--rosso);
    color:var(--bianco);
    cursor:pointer;
    transition:transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
    box-shadow:0 8px 24px -8px rgba(251,9,11,0.6);
  }
  button.cta:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px -8px rgba(251,9,11,0.8);
  }
  button.cta:active{transform:translateY(0px) scale(0.98);}

  button.ghost{
    background:transparent;
    border:2px solid #3a3a3a;
    color:var(--bianco);
  }
  button.ghost:hover{
    border-color:var(--oro);
    color:var(--oro);
    box-shadow:none;
    transform:translateY(-2px);
  }
  button.ghost:active{ transform:translateY(0) scale(0.98); }

  footer{
    position:relative;
    z-index:2;
    text-align:center;
    padding:30px 20px 50px;
    color:#6f6c66;
    font-size:0.95rem;
    letter-spacing:0.4px;
  }
  footer b{color:#b7b3aa;}

  /* Confetti canvas */
  #confetti-canvas{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:50;
  }

  /* GOAL flash text */
  .goal-flash{
    position:fixed;
    top:50%; left:50%;
    transform:translate(-50%,-50%) scale(0.6);
    font-family:'Anton', sans-serif;
    font-size:clamp(3rem, 14vw, 9rem);
    color:var(--bianco);
    -webkit-text-stroke:3px var(--rosso);
    letter-spacing:4px;
    opacity:0;
    z-index:51;
    pointer-events:none;
    text-shadow:0 0 60px rgba(251,9,11,0.9);
  }
  .goal-flash.play{
    animation:goalPop 1.1s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes goalPop{
    0%{opacity:0; transform:translate(-50%,-50%) scale(0.4) rotate(-6deg);}
    18%{opacity:1; transform:translate(-50%,-50%) scale(1.08) rotate(2deg);}
    30%{transform:translate(-50%,-50%) scale(1) rotate(0deg);}
    75%{opacity:1;}
    100%{opacity:0; transform:translate(-50%,-50%) scale(1) rotate(0deg);}
  }

  @media (prefers-reduced-motion: reduce){
    .live-dot::before{animation:none;}
    .goal-flash.play{animation:none; opacity:0;}
    .crest{animation:none;}
    .stars span{animation:none; opacity:0.9;}
    h1, .subline{animation:none; opacity:1;}
    .screen-rig{animation:none; opacity:1; transform:none;}
    .controls{animation:none; opacity:1;}
  }
</style>
</head>
<body>

<div class="stripes"></div>
<canvas id="confetti-canvas"></canvas>
<div class="goal-flash" id="goalFlash">GOAL!</div>

<header>
  <div class="crest" aria-hidden="true">
    <img src="./assets/img/acm logo.png" alt="">
  </div>
  <div class="stars" aria-hidden="true">
    <span style="--i:0"></span><span style="--i:1"></span><span style="--i:2"></span><span style="--i:3"></span><span style="--i:4"></span><span style="--i:5"></span><span style="--i:6"></span>
  </div>
  <h1>Forza <span class="em">Milan</span></h1>
  <p class="subline">Rossonero to the core — press play and let the San Siro roar.</p>
</header>

<main>
  <div class="screen-rig">
    <div class="screen-frame">
      <div class="screen-inner">
        <video id="milanVideo" playsinline preload="metadata">
          <source src="./assets/vid/cheer-video-high.mp4" type="video/mp4">
          Your browser doesn't support embedded video.
        </video>
        <div class="scanlight"></div>
      </div>
    </div>
    <div class="rig-label">
      <span class="live-dot">LIVE</span>
      <span><b>Casa Milan</b> · Match Moment</span>
    </div>
  </div>
</main>

<div class="controls">
  <button class="cta" id="playBtn">▶ Play the moment</button>
  <button class="ghost" id="goalBtn">🎺 Cue the crowd</button>
</div>

<footer>
  <b>Sempre Milan.</b> Rosso e Nero, dal 1899.
</footer>

<script>
(function(){
  const video = document.getElementById('milanVideo');
  const playBtn = document.getElementById('playBtn');
  const goalBtn = document.getElementById('goalBtn');
  const goalFlash = document.getElementById('goalFlash');
  const canvas = document.getElementById('confetti-canvas');
  const ctx = canvas.getContext('2d');

  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  /* ---------- Confetti ---------- */
  const COLORS = ['#FB090B', '#0A0A0A', '#F5F5F0', '#E7B740'];
  let particles = [];
  let confettiRunning = false;

  function spawnConfetti(count){
    const w = canvas.width;
    for(let i=0;i<count;i++){
      particles.push({
        x: Math.random()*w,
        y: -20 - Math.random()*200,
        vx: (Math.random()-0.5)*3,
        vy: 2 + Math.random()*3.5,
        size: 6 + Math.random()*7,
        color: COLORS[Math.floor(Math.random()*COLORS.length)],
        rot: Math.random()*Math.PI*2,
        vr: (Math.random()-0.5)*0.3,
        shape: Math.random() > 0.5 ? 'rect' : 'star',
        life: 0,
        maxLife: 260 + Math.random()*120
      });
    }
  }

  function drawStar(cx, cy, r){
    ctx.beginPath();
    for(let i=0;i<5;i++){
      const angle = (Math.PI*2*i)/5 - Math.PI/2;
      const x1 = cx + r*Math.cos(angle);
      const y1 = cy + r*Math.sin(angle);
      ctx.lineTo(x1,y1);
      const angle2 = angle + Math.PI/5;
      ctx.lineTo(cx + (r/2.4)*Math.cos(angle2), cy + (r/2.4)*Math.sin(angle2));
    }
    ctx.closePath();
    ctx.fill();
  }

  function tickConfetti(){
    ctx.clearRect(0,0,canvas.width, canvas.height);
    particles.forEach(p=>{
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.02;
      p.rot += p.vr;
      p.life++;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.color;
      ctx.globalAlpha = Math.max(0, 1 - p.life/p.maxLife);
      if(p.shape === 'rect'){
        ctx.fillRect(-p.size/2, -p.size/4, p.size, p.size/2);
      } else {
        drawStar(0,0,p.size/2);
      }
      ctx.restore();
    });
    particles = particles.filter(p => p.life < p.maxLife && p.y < canvas.height + 40);

    if(particles.length > 0){
      requestAnimationFrame(tickConfetti);
    } else {
      confettiRunning = false;
    }
  }

  function burstConfetti(){
    if(prefersReducedMotion) return;
    spawnConfetti(140);
    if(!confettiRunning){
      confettiRunning = true;
      requestAnimationFrame(tickConfetti);
    }
  }

  /* ---------- Synthesized crowd cheer + air horn (no external audio needed) ---------- */
  let audioCtx = null;
  function getAudioCtx(){
    if(!audioCtx){
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    return audioCtx;
  }

  function playCrowdRoar(){
    const ac = getAudioCtx();
    const duration = 2.2;
    const bufferSize = ac.sampleRate * duration;
    const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
    const data = buffer.getChannelData(0);

    // Filtered noise to emulate a rising/falling crowd roar
    let lastOut = 0;
    for(let i=0;i<bufferSize;i++){
      const white = Math.random()*2 - 1;
      lastOut = (lastOut + 0.02*white) / 1.02;
      data[i] = lastOut * 3.2;
    }

    const noiseSource = ac.createBufferSource();
    noiseSource.buffer = buffer;

    const bandpass = ac.createBiquadFilter();
    bandpass.type = 'bandpass';
    bandpass.frequency.value = 900;
    bandpass.Q.value = 0.6;

    const gain = ac.createGain();
    const now = ac.currentTime;
    gain.gain.setValueAtTime(0.0001, now);
    gain.gain.exponentialRampToValueAtTime(0.9, now + 0.35);
    gain.gain.linearRampToValueAtTime(0.6, now + 1.4);
    gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    noiseSource.connect(bandpass);
    bandpass.connect(gain);
    gain.connect(ac.destination);

    noiseSource.start(now);
    noiseSource.stop(now + duration);
  }

  function playAirHorn(){
    const ac = getAudioCtx();
    const now = ac.currentTime;
    [349.23, 440.00].forEach((freq, idx)=>{
      const osc = ac.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, now);

      const gain = ac.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.35, now + 0.05);
      gain.gain.setValueAtTime(0.3, now + 0.5);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.9);

      osc.connect(gain);
      gain.connect(ac.destination);
      osc.start(now);
      osc.stop(now + 0.95);
    });
  }

  function cueTheCrowd(){
    playCrowdRoar();
    playAirHorn();
    burstConfetti();
    if(!prefersReducedMotion){
      goalFlash.classList.remove('play');
      void goalFlash.offsetWidth;
      goalFlash.classList.add('play');
    }
  }

  playBtn.addEventListener('click', ()=>{
    if(video.paused){
      video.play();
    } else {
      video.pause();
    }
  });

  video.addEventListener('play', ()=>{
    playBtn.textContent = '⏸ Pause the moment';
    cueTheCrowd();
  });
  video.addEventListener('pause', ()=>{
    playBtn.textContent = '▶ Play the moment';
  });
  video.addEventListener('ended', ()=>{
    playBtn.textContent = '▶ Replay the moment';
  });

  goalBtn.addEventListener('click', cueTheCrowd);
})();
</script>

</body>
</html>
